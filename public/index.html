<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ALL AUTONOMOUS AI ASSISTANT by CloroLab</title>
  <style>
    body { background: #0b0f19; color: #e2e8f0; font-family: system-ui, sans-serif; margin: 0; padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; height: 93vh; }
    .card { background: #1e293b; border-radius: 14px; padding: 18px; overflow-y: auto; }
    h1 { font-size: 3.5rem; margin: 0; color: #38bdf8; }
    h2 { margin-top: 14px; color: #94a3b8; border-bottom: 1px solid #334155; padding-bottom: 6px; font-size: 1.1rem; display: flex; justify-content: space-between; align-items: center; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 0.85rem; margin-right: 6px; margin-bottom: 4px; background: #334155; }
    .group-tag { background: #0369a1; color: white; padding: 4px 10px; border-radius: 6px; font-size: 0.85rem; display: inline-block; margin: 3px; cursor: pointer; }
    #alert-box { display: none; position: fixed; inset: 0; background: rgba(220, 38, 38, 0.95); color: white; z-index: 999; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    #alert-box h1 { color: white; font-size: 4rem; margin-bottom: 10px; }
    button { background: #0284c7; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-size: 0.95rem; cursor: pointer; }
    button.sm { padding: 4px 10px; font-size: 0.8rem; background: #475569; }
    input, select { padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 0.95rem; }
  </style>
</head>
<body>
  <div id="alert-box">
    <h1 id="alert-text">ALARM!</h1>
    <p style="font-size: 1.3rem;">Press SPACEBAR or click below to dismiss</p>
    <button onclick="dismissAlert()">Dismiss Alarm (Space)</button>
  </div>

  <div class="card">
    <h1 id="clock">00:00:00</h1>
    <p id="status-badges"></p>
    <h2>📅 Today's Schedule (<span id="day-name"></span>)</h2>
    <ul id="schedule-list"></ul>
    <h2>⏰ Active Reminders & Calls</h2>
    <ul id="reminder-list"></ul>
    <h2>✅ To-Do List</h2>
    <ul id="todo-list"></ul>
  </div>

  <div class="card" style="display:flex; flex-direction:column; justify-content:space-between;">
    <div>
      <h2>
        <span>💬 School WhatsApp Feed</span>
        <button class="sm" onclick="clearWA()">Clear Feed</button>
      </h2>
      <div style="background:#0f172a; padding:10px; border-radius:8px; margin-bottom:10px;">
        <div style="font-size:0.85rem; color:#94a3b8; margin-bottom:6px;">Allowed Groups (Click to remove):</div>
        <div id="allowed-groups-list"></div>
        <div style="margin-top:8px; display:flex; gap:6px;">
          <input type="text" id="group-input" placeholder="Group/Teacher name..." style="width:50%;" />
          <select id="detected-groups" onchange="document.getElementById('group-input').value=this.value" style="width:35%;">
            <option value="">-- Detected Groups --</option>
          </select>
          <button class="sm" style="background:#0284c7;" onclick="addGroup()">+ Allow</button>
        </div>
      </div>

      <div id="wa-list"></div>

      <h2>🤖 Bilingual AI Assistant (EN / ID)</h2>
      <div id="ai-reply" style="white-space: pre-wrap; background:#0f172a; padding:12px; border-radius:8px; min-height:90px;">Ready for your command...</div>
    </div>
    <div style="margin-top: 12px; display:flex; gap:8px;">
      <input type="text" id="prompt-input" style="flex:1;" placeholder="e.g. Panggil saya jam 13.00 untuk belajar bahasa inggris..." onkeydown="if(event.key==='Enter') sendPrompt()" />
      <button onclick="sendPrompt()">Send</button>
    </div>
  </div>

  <script>
    setInterval(() => {
      document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-GB');
    }, 1000);

    async function refreshData() {
      const res = await fetch('/api/status');
      const data = await res.json();
      document.getElementById('day-name').innerText = data.today;
      document.getElementById('status-badges').innerHTML = `
        <span class="badge">${data.state.isMuted ? '🔇 Audio Muted' : '🔊 Audio Active'}</span>
        <span class="badge">${data.state.awayMode ? '🚪 Away Mode' : '🏠 Home Mode'}</span>
      `;
      document.getElementById('schedule-list').innerHTML = data.schedule.map(s => `<li>${s}</li>`).join('') || '<li>No classes scheduled today</li>';
      document.getElementById('reminder-list').innerHTML = data.reminders.map(r => `<li><b>${r.time}</b> - ${r.message}</li>`).join('') || '<li>No active reminders</li>';
      document.getElementById('todo-list').innerHTML = data.todos.map(t => `<li>[${t.id}] ${t.task}</li>`).join('') || '<li>All tasks completed!</li>';
      document.getElementById('wa-list').innerHTML = data.wa.map(w => `<p style="font-size:0.9rem; border-bottom:1px solid #334155; padding-bottom:4px; margin:4px 0;"><b>${w.chat_name} (${w.sender}):</b> ${w.message}</p>`).join('') || '<p style="color:#64748b; font-size:0.9rem;">No messages from allowed groups yet.</p>';

      document.getElementById('allowed-groups-list').innerHTML = data.allowedGroups.map(g => 
        `<span class="group-tag" onclick="removeGroup('${g}')" title="Click to remove">✅ ${g} ✖</span>`
      ).join('') || '<span style="font-size:0.8rem; color:#ef4444;">No groups allowed yet! Add one below.</span>';

      const select = document.getElementById('detected-groups');
      if (data.knownGroups && data.knownGroups.length !== select.options.length - 1) {
        select.innerHTML = '<option value="">-- Select WA Group --</option>' + 
          data.knownGroups.map(g => `<option value="${g}">${g}</option>`).join('');
      }

      const alertBox = document.getElementById('alert-box');
      if (data.state.activeAlert) {
        alertBox.style.display = 'flex';
        document.getElementById('alert-text').innerText = data.state.activeAlert.text;
      } else {
        alertBox.style.display = 'none';
      }
    }

    async function addGroup() {
      const input = document.getElementById('group-input');
      if (!input.value.trim()) return;
      await fetch('/api/groups/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: input.value.trim() })
      });
      input.value = '';
      refreshData();
    }

    async function removeGroup(name) {
      await fetch('/api/groups/remove', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      });
      refreshData();
    }

    async function clearWA() {
      await fetch('/api/wa/clear', { method: 'POST' });
      refreshData();
    }

    async function dismissAlert() {
      await fetch('/api/dismiss', { method: 'POST' });
      refreshData();
    }

    async function sendPrompt() {
      const input = document.getElementById('prompt-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      document.getElementById('ai-reply').innerText = '⏳ Thinking...';
      try {
        const res = await fetch('/api/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });
        const data = await res.json();
        document.getElementById('ai-reply').innerText = data.answer;
      } catch (e) {
        document.getElementById('ai-reply').innerText = '❌ Connection error: ' + e.message;
      }
      refreshData();
    }

    window.addEventListener('keydown', e => {
      if (e.code === 'Space' && document.getElementById('alert-box').style.display === 'flex') {
        dismissAlert();
      }
    });

    setInterval(refreshData, 3000);
    refreshData();
  </script>
</body>
</html>
